services:
  - type: web
    name: quash
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /index.html
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_BASE_URL
        value: https://quash-ugtq.onrender.com
